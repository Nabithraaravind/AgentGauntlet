name: AgentGauntlet
description: Run the scripted smoke gate and write a Markdown score.
inputs:
  subset:
    description: A task id or a domain name.
    required: false
    default: retail-001
  k:
    description: Trials per task.
    required: false
    default: "1"
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.11.33"
        python-version: "3.12"

    - name: Sync
      shell: bash
      run: uv sync --locked --no-dev

    - name: Run and summarize
      shell: bash
      run: |
        uv run gauntlet run \
          --tasks "${{ inputs.subset }}" \
          --k "${{ inputs.k }}" \
          --run-id action-smoke \
          --runs-dir runs
        mkdir -p runs/action-smoke
        uv run gauntlet report runs/action-smoke --markdown > runs/action-smoke/summary.md
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat runs/action-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
