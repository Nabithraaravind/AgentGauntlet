[project]
name = "agentgauntlet"
version = "0.1.0.dev0"
description = "pytest for AI agents: state-based grading, pass^k reliability, cost, and prompt-injection security."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "AgentGauntlet contributors" }]
keywords = ["agents", "llm", "evaluation", "mcp", "benchmark", "reliability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime dependencies are added in the milestone that first imports them.
dependencies = [
    "faker>=40.43.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/Nabithraaravind/AgentGauntlet"
Repository = "https://github.com/Nabithraaravind/AgentGauntlet"
Issues = "https://github.com/Nabithraaravind/AgentGauntlet/issues"
Changelog = "https://github.com/Nabithraaravind/AgentGauntlet/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgauntlet"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentgauntlet/domains/retail/policy.md" = "agentgauntlet/domains/retail/policy.md"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
required-version = ">=0.11.33"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "N",    # pep8-naming
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
]
# Google style wants a blank line before the summary's opposite rules.
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Assert is the pytest API.
"tests/**/*.py" = ["S101"]
# Seeded task generation, not cryptography.
"src/agentgauntlet/domains/**/*.py" = ["S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["agentgauntlet"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
mypy_path = "src"
files = ["src/agentgauntlet", "tests", "tasks/validate.py"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=agentgauntlet",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
source = ["src/agentgauntlet"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
